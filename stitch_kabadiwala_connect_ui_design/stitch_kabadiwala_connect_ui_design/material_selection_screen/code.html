<script>
    function toggleSelection(card) {
      const isSelected = card.classList.contains('selected');
      const badge = card.querySelector('.selection-badge');
      const icon = card.querySelector('.material-symbols-outlined');
      const title = card.querySelector('.text-label-lg');

      if (isSelected) {
        card.classList.remove('selected', 'border-2', 'border-primary-container', 'bg-secondary-container/20', 'shadow-sm');
        card.classList.add('border-surface-variant', 'bg-surface-container-lowest');
        badge.classList.add('hidden');
        if (title) {
          title.classList.remove('text-primary-container', 'font-bold');
          title.classList.add('text-on-surface');
        }
      } else {
        card.classList.add('selected', 'border-2', 'border-primary-container', 'bg-secondary-container/20', 'shadow-sm');
        card.classList.remove('border-surface-variant', 'bg-surface-container-lowest');
        badge.classList.remove('hidden');
        if (title) {
          title.classList.add('text-primary-container', 'font-bold');
          title.classList.remove('text-on-surface');
        }
      }
    }
  </script>
