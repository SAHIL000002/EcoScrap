services:
  # EcoScrap API — Render blueprint (https://render.com/docs/blueprint-spec)
  #
  # Deploy: push this repository to GitHub, then in Render choose
  # "New +" -> "Blueprint" and point it at the repository. Render reads this
  # file and asks for the three secret values marked `sync: false`.
  - type: web
    name: ecoscrap-api
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Existing MongoDB Atlas cluster (mongodb+srv://...). Paste the same URI
      # that is in backend/.env so the deployed API sees the seeded data.
      - key: MONGO_URI
        sync: false
      # Render generates a strong secret on first deploy - do not hardcode one.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Optional: without these the API still works, but photo uploads fall back
      # to ephemeral local storage (see ImageService).
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
